name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Offline checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Standard-library tests and model hashes
        run: python scripts/test_local.py
      - name: Pinned viewer API and workbench regressions
        run: |
          node scripts/test_osd_runtime.js
          node scripts/test_panorama_workbench_ui.js
          node scripts/test_vendor_csp.js
          node scripts/test_results_model.js
          node scripts/test_results_ui.js
          node scripts/test_scene_navigation_ui.js
          node scripts/test_workbench_ui.js
          node scripts/test_console_live_ui.js
          node scripts/test_initialization_ui.js
          node scripts/test_first_capture_ui.js
          node scripts/test_patrol_ui.js
          node scripts/test_overview_ui.js
      - name: Public release audit and file manifest
        run: python scripts/check_release.py --verify-manifest
      - name: Bash syntax
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

  scene-tools:
    name: Scene geometry (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install PC geometry dependencies
        run: python -m pip install -r tools/scene_mapping/requirements.txt
      - name: Geometry and proposal tests without model downloads
        run: python -m unittest discover -s tools/scene_mapping -p "test_*.py" -v
