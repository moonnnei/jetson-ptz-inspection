name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Offline checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Standard-library tests and model hashes
        run: python scripts/test_local.py
      - name: Public release audit and file manifest
        run: python scripts/check_release.py --verify-manifest
      - name: Bash syntax
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
